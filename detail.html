<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>산단 심박 — 상세</title>
  <!-- 색은 전부 theme.css 의 :root 변수. 여기에 색값을 직접 쓰지 않는다. -->
  <link rel="stylesheet" href="./src/theme.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: sans-serif;
           background: var(--sunken); color: var(--ink);
           overflow: hidden; }

    #hud { position: fixed; top: 22px; left: 26px; z-index: 10; }
    #region-name { font-size: 32px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    /* 나중에 업종·수치가 들어갈 자리 */
    #region-stat { font-size: 13px; color: var(--ink-faint); margin: 6px 0 12px; }
    #back { color: var(--accent); font-size: 14px; text-decoration: none; }
    #back:hover { text-decoration: underline; }

    #wrap { position: relative; width: 100%; height: 100%; }

    /* 2.5D: 직교 투영. perspective 를 주지 않는다 — 큰 평면에 걸면 키스톤 왜곡이
       생겨 판이 휘어 보인다. 아이소메트릭은 평행선이 유지되는 투영이다. */
    #stage { position: absolute; inset: 0; overflow: hidden; }

    /* rotateX 로 세로가 cos(52°)≈0.616 배 눌린다. #tilt 를 #stage 높이 그대로 두면
       평면이 화면 세로의 62% 밖에 안 되므로, 눌리는 만큼 미리 늘려 둔다.
       100% / 0.616 ≈ 162% 가 정확한 보정이지만 rotateZ 로 평면이 자기 안에서
       돌아가며 가로로 조금 넘치므로 142% (top/bottom -21%) 로 줄인다.
       음수 inset 이라 위아래로 똑같이 넘치고, 결과적으로 중앙에 온다.
       #land 에 aspect-ratio 를 주면 #stage 보다 높아져 overflow 에 걸리므로 주지 않는다. */
    #tilt { position: absolute; left: 0; right: 0; top: -21%; bottom: -21%;
            transform: rotateX(52deg) rotateZ(-8deg); transform-origin: 50% 50%; }

    /* 바닥면 — #tilt 와 같은 평면에 누워 있다. 여백이 빈 곳이 아니라 공간으로
       보이게 하는 게 목적이라 #tilt 보다 훨씬 크게 뺀다. #stage 가 잘라준다.
       땅보다 훨씬 낮은 명도. 먼 쪽(위) 끝은 mask 로 흐려 지평선을 감춘다. */
    #floor { position: absolute; left: -150%; right: -150%; top: -150%; bottom: -150%;
             background:
               repeating-linear-gradient(to right,  var(--floor-line) 0 1px, transparent 1px 72px),
               repeating-linear-gradient(to bottom, var(--floor-line) 0 1px, transparent 1px 72px),
               var(--floor);
             /* mask 의 #000 은 팔레트 색이 아니라 알파 스톱(불투명)이다. 변수로 빼지 않는다. */
             -webkit-mask-image: linear-gradient(to bottom, transparent 30%, #000 46%);
             mask-image: linear-gradient(to bottom, transparent 30%, #000 46%); }

    /* viewBox 를 bbox 보다 넉넉히 잡으므로 외곽선 전체가 프레임 안에 들어온다 */
    #land { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

    /* flood-color 는 SVG 속성으로는 var() 를 못 받는다 → CSS 로 건다 */
    #ground-shadow feDropShadow { flood-color: var(--shadow); flood-opacity: 0.85; }

    #err { position: fixed; bottom: 16px; left: 26px; color: var(--alert); font-size: 13px;
           margin: 0; }
  </style>
</head>
<body>
  <div id="hud">
    <h1 id="region-name">…</h1>
    <p id="region-stat">전력 데이터 미확보</p>
    <a id="back" href="index.html">← 전체 지도</a>
  </div>
  <div id="wrap">
    <div id="stage">
      <div id="tilt">
        <div id="floor"></div>
        <svg id="land" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 맨 아래층에만 걸어서 땅이 바닥에 놓인 느낌을 만든다.
                 필터 영역을 넉넉히 잡아야 그림자가 bbox 에서 잘리지 않는다. -->
            <filter id="ground-shadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="7" stdDeviation="5"/>
            </filter>
          </defs>
          <g id="layers"></g>
        </svg>
      </div>
    </div>
    <p id="err"></p>
  </div>
  <script type="module" src="./src/detail.js"></script>
</body>
</html>
