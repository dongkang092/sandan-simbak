<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>산단 심박 — 상세</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    #wrap { max-width: 900px; margin: 0 auto; padding: 16px; }

    #hud { position: fixed; top: 16px; left: 16px; z-index: 10; }
    #region-name { font-size: 24px; margin: 0 0 4px; }
    #back { color: #8ab; font-size: 14px; }

    /* 2.5D: 감싸는 div 에 perspective, 안쪽 div 를 rotateX */
    #stage { perspective: 1200px; height: 88vh;
             display: grid; place-items: center; overflow: hidden; }
    #tilt { width: 100%; transform: rotateX(55deg); transform-origin: 50% 50%; }

    /* 렌더링 주의: doctype + aspect-ratio 없으면 SVG 가 0x0 이 된다.
       실제 aspect-ratio 는 bbox 비율로 JS 가 덮어쓴다. */
    #land { display: block; margin: 0 auto; overflow: visible;
            width: 100%; max-height: 95vh; aspect-ratio: 1 / 1; }
    #err { color: #c96; }
  </style>
</head>
<body>
  <div id="hud">
    <h1 id="region-name">…</h1>
    <a id="back" href="index.html">← 전체 지도</a>
  </div>
  <div id="wrap">
    <div id="stage">
      <div id="tilt">
        <svg id="land" xmlns="http://www.w3.org/2000/svg">
          <g id="layers"></g>
        </svg>
      </div>
    </div>
    <p id="err"></p>
  </div>
  <script type="module" src="./src/detail.js"></script>
</body>
</html>
