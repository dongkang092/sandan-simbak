<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>산단 심박 — 상세</title>
  <!-- 색은 전부 theme.css 의 :root 변수. 여기에 색값을 직접 쓰지 않는다. -->
  <link rel="stylesheet" href="./src/theme.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; font-family: sans-serif;
           background: var(--sunken); color: var(--ink);
           overflow: hidden; }

    #hud { position: fixed; top: 22px; left: 26px; z-index: 10; }
    #region-name { font-size: 32px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    /* 나중에 업종·수치가 들어갈 자리 */
    #region-stat { font-size: 13px; color: var(--ink-faint); margin: 6px 0 12px; }
    /* ⚠ 가상 클러스터 범례. 어느 덩어리가 어느 업종인지 확인하는 용도다.
       땅 위에 글자를 얹으면 rotateX 에 눌려 읽히지 않으므로 HUD 에 둔다. */
    #cluster-legend { list-style: none; margin: 0 0 14px; padding: 0;
                      font-size: 12px; color: var(--ink-dim); }
    #cluster-legend li { margin: 2px 0; font-variant-numeric: tabular-nums; }
    #cluster-legend .n { color: var(--ink-faint); }
    #back { color: var(--accent); font-size: 14px; text-decoration: none; }
    #back:hover { text-decoration: underline; }

    #wrap { position: relative; width: 100%; height: 100%; }

    /* 2.5D: 직교 투영. perspective 를 주지 않는다 — 큰 평면에 걸면 키스톤 왜곡이
       생겨 판이 휘어 보인다. 아이소메트릭은 평행선이 유지되는 투영이다. */
    #stage { position: absolute; inset: 0; overflow: hidden; }

    /* rotateX 만 쓴다. rotateZ 를 걸면 평면이 자기 안에서 돌아가 바닥 격자선이
       대각선이 되고 지형도 비스듬히 눕는다 — 모형도처럼 보이려면 축 정렬이 맞아야
       한다. rotateZ 가 없으므로 격자 가로선은 완전히 수평, 세로선은 수직이다.
       또 이 덕분에 상자에서 보이는 면이 윗면·앞면 둘뿐이라 폴리곤 2개로 그릴 수 있다.

       rotateX(64°) 로 세로가 cos(64°)≈0.438 배 눌린다. #tilt 를 #stage 높이 그대로
       두면 평면이 화면 세로의 44% 밖에 안 되므로, 눌리는 만큼 미리 늘려 둔다.
       100% / 0.438 ≈ 228% → top/bottom 각각 -64%. 음수 inset 이라 위아래로
       똑같이 넘치고, 결과적으로 중앙에 온다. **각도를 바꾸면 이 값도 같이
       바꿔야 한다** — 안 바꾸면 판이 화면 세로를 못 채우거나 잘린다. (rotateZ 가 없어 가로 넘침 보정이
       필요없다 — 예전처럼 배율을 깎지 않는다.)
       #land 에 aspect-ratio 를 주면 #stage 보다 높아져 overflow 에 걸리므로 주지 않는다. */
    #tilt { position: absolute; left: 0; right: 0; top: -64%; bottom: -64%;
            transform: rotateX(64deg); transform-origin: 50% 50%; }

    /* 바닥면 — #tilt 와 같은 평면에 누워 있다. 여백이 빈 곳이 아니라 공간으로
       보이게 하는 게 목적이라 #tilt 보다 훨씬 크게 뺀다. #stage 가 잘라준다.
       땅보다 훨씬 낮은 명도. 먼 쪽(위) 끝은 mask 로 흐려 지평선을 감춘다. */
    #floor { position: absolute; left: -150%; right: -150%; top: -150%; bottom: -150%;
             background:
               repeating-linear-gradient(to right,  var(--floor-line) 0 1px, transparent 1px 72px),
               repeating-linear-gradient(to bottom, var(--floor-line) 0 1px, transparent 1px 72px),
               var(--floor);
             /* mask 의 #000 은 팔레트 색이 아니라 알파 스톱(불투명)이다. 변수로 빼지 않는다. */
             -webkit-mask-image: linear-gradient(to bottom, transparent 30%, #000 46%);
             mask-image: linear-gradient(to bottom, transparent 30%, #000 46%); }

    /* viewBox 를 bbox 보다 넉넉히 잡으므로 외곽선 전체가 프레임 안에 들어온다 */
    #land { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

    /* flood-color 는 SVG 속성으로는 var() 를 못 받는다 → CSS 로 건다 */
    #ground-shadow feDropShadow { flood-color: var(--shadow); flood-opacity: 0.85; }

    /* ⚠ 건물은 buildings.mock.json 의 가상 데이터다. 실데이터로 교체하면
       이 배지와 #mock-badge 관련 코드를 전부 지운다. */
    #mock-badge { position: fixed; top: 22px; right: 26px; z-index: 10;
                  font-size: 12px; letter-spacing: 0.02em;
                  color: var(--alert); border: 1px solid var(--alert);
                  border-radius: 3px; padding: 5px 9px; }

    #err { position: fixed; bottom: 16px; left: 26px; color: var(--alert); font-size: 13px;
           margin: 0; }
  </style>
</head>
<body>
  <!-- ⚠ 가상 데이터 표시. 건물이 실데이터로 바뀌면 이 배지를 지운다. -->
  <div id="mock-badge" hidden>건물 = 가상 데이터</div>
  <div id="hud">
    <h1 id="region-name">…</h1>
    <p id="region-stat">전력 데이터 미확보</p>
    <ul id="cluster-legend"></ul>
    <a id="back" href="index.html">← 전체 지도</a>
  </div>
  <div id="wrap">
    <div id="stage">
      <div id="tilt">
        <div id="floor"></div>
        <svg id="land" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 맨 아래층에만 걸어서 땅이 바닥에 놓인 느낌을 만든다.
                 필터 영역을 넉넉히 잡아야 그림자가 bbox 에서 잘리지 않는다. -->
            <filter id="ground-shadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="7" stdDeviation="5"/>
            </filter>
            <!-- ⚠ 가상 단지 바닥의 마감. 모양 자체는 detail.js 가 만든다
                 (건물 앞치마 + 건물끼리 잇는 목). 여기서는 이어붙인 자리의
                 각을 죽이고 경계를 다시 또렷하게 만드는 일만 한다.
                 흐림 → 알파 문턱 = 도형들의 합집합을 하나의 매끈한 외곽으로.
                 예전에는 dilate/erode(모폴로지 닫기)로 모양까지 만들었는데,
                 그러면 건물 사이가 통째로 메워지거나(답답함) 반대로 고리 안쪽에
                 **구멍**이 남고 멀리 떨어진 건물이 **고립**됐다. 둘 다 모폴로지로는
                 막을 수 없다 — 그래서 모양을 기하로 직접 만든다. -->
            <filter id="site-smooth" x="-15%" y="-15%" width="130%" height="130%">
              <feGaussianBlur stdDeviation="1.4"/>
              <feComponentTransfer>
                <feFuncA type="discrete" tableValues="0 1"/>
              </feComponentTransfer>
            </filter>
          </defs>
          <g id="layers"></g>
          <!-- ⚠ 가상 단지 바닥. 건물보다 먼저 그려 깔개가 되게 한다. -->
          <g id="pads"></g>
          <!-- ⚠ 가상 건물 (buildings.mock.json). 땅보다 뒤에 있어야 위에 그려진다. -->
          <g id="buildings"></g>
        </svg>
      </div>
    </div>
    <p id="err"></p>
  </div>
  <script type="module" src="./src/detail.js"></script>
</body>
</html>
